<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>

    /* Common styles NE PAS MODIFIER */
    body, html{
      padding:0;
      margin:0;
      background:#999;
      width:100vw;
      min-height:100vh;
    }
    header{
      background:#feb;
    }
    article{
      background:#dd8;
    }
    nav{
      background:#ccf;
    }
    aside{
      background:#ccf;
    }
    footer{
      background:#feb;
    }
    header, article, nav, aside, footer{
      border-radius:5px;
      padding:5px;
    }

    /* Votre code CSS pour design par Grid ci-après */

    /* ---------- DESKTOP ---------- */
    @media screen and (min-width: 640px) {
      body {
        display: grid;
        height: 100vh;
        grid-template-columns: minmax(100px 160px) 1fr minmax(100px 160px);
        grid-template-rows: 10vh 1fr 10vh;
        grid-gap: 5px;
        grid-template-areas:
          "head head head"
          "nav  main aside"
          "foot foot foot";
      }
      
      header  { 
        grid-area: head; 
      }
      nav     { 
        grid-area: nav; 
      }
      article { 
        grid-area: main; 
      }
      aside   { 
        grid-area: aside; 
      }
      footer  { 
        grid-area: foot; 
      }
    }

  </style>
</head>
<!-- NE PAS MODIFIER LE CODE CI-APRES -->
<body>
  <header>Header</header>
  <article>Article</article>
  <nav>Navigation</nav>
  <aside>Aside</aside>
  <footer>Footer</footer>
</body>
</html>
