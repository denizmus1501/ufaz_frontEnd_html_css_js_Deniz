<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>

    /* Common styles NE PAS MODIFIER */
    body, html{
      padding:0;
      margin:0;
      background:#999;
      width:100vw;
      min-height:100vh;
    }
    header{
      background:#feb;
    }
    article{
      background:#dd8;
    }
    nav{
      background:#ccf;
    }
    aside{
      background:#ccf;
    }
    footer{
      background:#feb;
    }
    header, article, nav, aside, footer{
      border-radius:5px;
      padding:5px;
    }

    /* Votre code CSS pour design par Grid ci-après */

    body {
      display: grid;
      grid-template-columns: minmax(100px, 140px) 1fr minmax(100px, 160px);
      grid-template-rows: minmax(20px, 60px) 1fr minmax(20px, 60px);
      grid-template-areas:
        "header header  header"
        "nav    article aside"
        "footer footer  footer";
      gap: 5px;

    }

    header {
      grid-area: header;
    }

    article {
      grid-area: article;
    }

    nav {
      grid-area: nav;
    }

    aside {
      grid-area: aside;
    }

    footer {
      grid-area: footer;
    }

     /* ---------- MOBILE ---------- */
    @media screen and (max-width: 640px) {
      body {
        display: grid;
        height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: 10vh 1fr repeat(3, 10vh);
        grid-gap: 5px;
      }
      header  { grid-column: 1; grid-row: 1; }
      article { grid-column: 1; grid-row: 2; }
      nav     { grid-column: 1; grid-row: 3; }
      aside   { grid-column: 1; grid-row: 4; }
      footer  { grid-column: 1; grid-row: 5; }
    }

  </style>

</head>
<!-- NE PAS MODIFIER LE CODE CI-APRES -->
<body>
  <header>Header</header>
  <article>Article</article>
  <nav>Navigation</nav>
  <aside>Aside</aside>
  <footer>Footer</footer>
</body>
</html>
